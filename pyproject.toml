[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "A modular semantic search engine in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "Flask>=3.0,<4.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
production = [
    "gunicorn>=22.0,<24.0; platform_system != 'Windows'",
    "waitress>=3.0,<4.0; platform_system == 'Windows'",
]

[project.scripts]
semantic-search = "src.retrieval.cli:main"
semantic-search-api = "src.api.app:main"
semantic-search-evaluate = "src.evaluation.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
